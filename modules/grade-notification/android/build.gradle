plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ruskcoder.gradexis.gradenotification'
version = '0.1.0'

android {
  namespace "com.ruskcoder.gradexis.gradenotification"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // NotificationCompat / NotificationManagerCompat / ContextCompat.getColor.
  // Same coordinate expo-notifications pulls in, so Gradle resolves one version.
  implementation 'androidx.core:core:1.17.0'

  // GradeCheckWorker: WorkManager at the version expo-background-task uses, and
  // that module itself for the task consumer the worker executes.
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
  implementation project(':expo-background-task')
}
